# Copy to config.properties; never commit actual credentials or key files.
# Keep MySQL on loopback or a trusted private network, not the public Internet.
db.host=127.0.0.1
db.name=account_management
db.port=3306
db.user=am_app
db.password=REPLACE_WITH_DATABASE_PASSWORD
# Absolute path recommended. Generate once with Main keygen; back it up safely.
key.file=/opt/acc_mgr/backend/vault.key
# Bind all IPv4 interfaces. Use 127.0.0.1 for a same-host Nginx-only upstream.
# Omitting http.host preserves the previous loopback-only behavior.
http.host=0.0.0.0
http.port=18082
# Optional exact H5 origin (scheme + host + optional port, no trailing slash).
# Keep empty to reject browser Origin headers. Serve H5 and API through one origin.
http.browserOrigin=

# Enable only after applying 005-dingtalk.sql. Secrets stay on the server.
dingtalk.enabled=false
dingtalk.corpId=REPLACE_WITH_CORP_ID
dingtalk.clientId=REPLACE_WITH_APP_KEY
dingtalk.clientSecret=REPLACE_WITH_APP_SECRET
