<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://g.alicdn.com/dingding/dingtalk-jsapi/3.0.31/dingtalk.open.js; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>帐号管理</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=20261013-copy2">
  <script src="app.js?v=20261013-copy2" defer></script>
</head>
<body>
  <main>
    <header><h1 id="page-title">帐号管理</h1><span class="muted small">随时查找 · 便捷分享</span></header>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="login-panel" class="panel">
      <h2>欢迎回来</h2><p class="muted">使用已有帐号，随时查找与管理分享。</p>
      <button id="ding-login" type="button" class="primary full" hidden>使用钉钉身份登录</button>
      <p id="ding-hint" class="muted small" hidden></p>
      <form id="login-form">
        <label>用户名<input id="username" autocomplete="username" maxlength="100" required></label>
        <label>登录密码<input id="login-password" type="password" autocomplete="current-password" maxlength="256" required></label>
        <label id="bind-choice" hidden><input id="bind-dingtalk" type="checkbox">验证密码并绑定当前钉钉身份，下次自动登录</label>
        <button class="primary full" type="submit">登录</button>
      </form>
      <p class="muted small">管理员可查看你保存的平台帐号和密码。</p>
    </section>
    <section id="password-panel" class="panel" hidden>
      <h2>修改登录密码</h2><p class="muted">修改后所有设备需要重新登录。</p>
      <form id="password-form">
        <label>原密码<input id="old-password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <label>新密码（至少 6 位）<input id="new-password" type="password" autocomplete="new-password" required maxlength="256"></label>
        <label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" required maxlength="256"></label>
        <button type="submit" class="primary full">修改并重新登录</button><button id="cancel-password" type="button" class="full">返回</button>
      </form>
    </section>
    <section id="library" hidden>
      <nav id="scope-tabs" aria-label="帐号范围"><button data-scope="own" aria-pressed="true">我的帐号</button><button data-scope="received" aria-pressed="false">分享给我</button></nav>
      <div class="search"><input id="search" type="search" placeholder="搜索平台、帐号或备注" aria-label="搜索帐号"><button id="refresh">刷新</button></div>
      <details id="filter-box"><summary>平台与标签筛选</summary><div class="filters"><label>平台<select id="platform-filter"><option value="">全部平台</option></select></label><label>标签<select id="tag-filter"><option value="">全部标签</option></select></label></div></details>
      <p id="count" class="muted"></p><div id="accounts"></div>
    </section>
    <section id="unbind-panel" class="panel" hidden>
      <h2>解除钉钉绑定</h2><p class="muted">解除后所有设备需要重新登录，下次钉钉免登需要重新验证密码并绑定。</p>
      <form id="unbind-form"><label>当前登录密码<input id="unbind-password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary full" type="submit">确认解绑并退出</button><button id="cancel-unbind" class="full" type="button">取消</button></form>
    </section>
    <section id="detail" class="panel" hidden>
      <button id="back">← 返回列表</button><h2 id="detail-title"></h2><p id="detail-platform" class="muted"></p><div id="detail-tags"></div>
      <div class="detail-actions"><button id="copy-all" class="primary">整体复制</button><button id="open-sharing">分享管理</button></div>
      <label>登录帐号</label><div class="value-row"><span id="account-login" class="value"></span><button id="copy-login">复制</button></div>
      <label>平台密码</label><div class="secret"><span id="secret" class="value">••••••••</span><div class="actions"><button id="reveal">显示密码</button><button id="copy-password">复制密码</button></div></div>
      <label>平台网址</label><p id="account-url" class="value"></p><label>备注</label><p id="account-notes" class="value notes"></p>
    </section>
    <section id="share-panel" class="panel" hidden>
      <button id="share-back">← 返回帐号</button><h2 id="share-title"></h2>
      <section id="sharing"><h3>分享管理</h3><p class="muted small">接收人只读，可显示和复制密码；你可随时撤销。</p><div id="recipients"></div>
        <form id="recipient-form"><label>钉钉姓名或完整用户名<input id="recipient-name" placeholder="输入姓名片段或完整用户名" maxlength="100" required autocomplete="off"></label><button type="submit">查找接收人</button></form><div id="recipient-result"></div>
      </section>
    </section>
    <section id="my-panel" class="panel" hidden>
      <label>登录帐号</label><p id="identity" class="value"></p>
      <label>钉钉绑定</label><p id="binding-status" class="value"></p>
      <label>钉钉姓名</label><p id="ding-name" class="value"></p>
      <button id="refresh-binding" class="full">刷新绑定信息</button>
      <button id="change-password" class="full">修改登录密码</button>
      <button id="unbind-dingtalk" class="full" hidden>解除钉钉绑定</button>
      <button id="logout" class="full" hidden>退出登录</button>
    </section>
    <pre id="copy-fallback" class="value panel" hidden tabindex="0" aria-label="待复制内容"></pre>
    <nav id="bottom-nav" aria-label="主要导航" hidden>
      <button data-page="find" aria-pressed="true">找帐号</button>
      <button data-page="share" aria-pressed="false">分享</button>
      <button data-page="my" aria-pressed="false">我的</button>
    </nav>
  </main>
</body>
</html>
