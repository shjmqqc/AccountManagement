# Merge INSIDE the existing www.shjpnn.com VirtualHost. Apache 2.2 syntax.
Alias /accmgr-mobile/ /opt/acc_mgr/mobile/
<Directory /opt/acc_mgr/mobile/>
    Options -Indexes
    AllowOverride None
    Order allow,deny
    Allow from all
    DirectoryIndex index.html
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store"
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "DENY"
    </IfModule>
</Directory>
ProxyRequests Off
ProxyPass /accmgr-api/ http://127.0.0.1:18082/
ProxyPassReverse /accmgr-api/ http://127.0.0.1:18082/
